name: iShweather
options:
  bundleIdPrefix: com.tedshaffer
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.2"

settings:
  base:
    SWIFT_VERSION: "5.10"
    ENABLE_PREVIEWS: YES

targets:
  iShweather:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - iShweather
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tedshaffer.iShweather
        INFOPLIST_FILE: iShweather/Info.plist
        SWIFT_VERSION: "5.10"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
